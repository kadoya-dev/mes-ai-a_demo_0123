<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>MES-AI-A 商品分析（レイアウト5）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./styles.css?v=20260107_2" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body class="fifth-layout">

<header class="app-header">
  <div class="header-left">
    <div class="header-title-row">
      <h1>MES-AI-A 商品分析 0116-13</h1>
      <div id="appVersion" class="header-version" aria-label="アプリのバージョン"></div>
    </div>
    <div class="sub">検索条件でASINを表示</div>
  </div>

  <div class="header-right">
    <div id="headerStatus" class="header-status"></div>
  </div>
</header>

<main class="page-body">
  <section class="search-panel card">
    <div class="search-head">
      <div class="card-title">検索条件</div>
      <div class="search-result">該当 <span id="searchResultCount">0</span>件</div>
    </div>
    <div class="search-grid">
      <label class="search-field">
        <span>キーワード</span>
        <input id="searchKeyword" type="text" placeholder="ASIN・商品名など" />
      </label>
      <label class="search-field">
        <span>カテゴリ</span>
        <select id="searchCategory"></select>
      </label>
      <label class="search-field">
        <span>材質</span>
        <select id="searchMaterial"></select>
      </label>
      <label class="search-field">
        <span>粗利益率(以上)</span>
        <input id="searchProfitRateMin" type="number" min="0" step="0.1" placeholder="例: 20" />
      </label>
      <label class="search-field">
        <span>粗利益額(以上)</span>
        <input id="searchProfitMin" type="number" min="0" step="1" placeholder="例: 2000" />
      </label>
      <label class="search-field">
        <span>販売価格($)範囲</span>
        <div class="search-range">
          <input id="searchSellMin" type="number" min="0" step="0.1" placeholder="min" />
          <span>〜</span>
          <input id="searchSellMax" type="number" min="0" step="0.1" placeholder="max" />
        </div>
      </label>
      <label class="search-field">
        <span>FBA最安値(以下)</span>
        <input id="searchFbaMax" type="number" min="0" step="1" placeholder="例: 2500" />
      </label>
      <label class="search-field">
        <span>仕入れ目安単価(範囲)</span>
        <div class="search-range">
          <input id="searchCostMin" type="number" min="0" step="1" placeholder="min" />
          <span>〜</span>
          <input id="searchCostMax" type="number" min="0" step="1" placeholder="max" />
        </div>
      </label>
      <label class="search-field">
        <span>30日販売数(以上)</span>
        <input id="searchSalesMin" type="number" min="0" step="1" placeholder="例: 10" />
      </label>
      <label class="search-field">
        <span>60日販売数(以上)</span>
        <input id="searchSales60Min" type="number" min="0" step="1" placeholder="例: 20" />
      </label>
      <label class="search-field">
        <span>90日販売数(以上)</span>
        <input id="searchSales90Min" type="number" min="0" step="1" placeholder="例: 30" />
      </label>
      <label class="search-field">
        <span>予測30日販売数(以上)</span>
        <input id="searchForecast30Min" type="number" min="0" step="1" placeholder="例: 15" />
      </label>
      <label class="search-field">
        <span>セラー数(以下)</span>
        <input id="searchSellerMax" type="number" min="0" step="1" placeholder="例: 6" />
      </label>
    </div>
    <div class="search-advanced" id="searchAdvanced">
      <div class="search-grid">
        <label class="search-field">
          <span>レビュー評価(以上)</span>
          <input id="searchReviewMin" type="number" min="0" step="0.1" placeholder="例: 4.0" />
        </label>
        <label class="search-field">
          <span>サイズ感(範囲)</span>
          <div class="search-range">
            <input id="searchSizeMin" type="number" min="0" step="0.1" placeholder="min" />
            <span>〜</span>
            <input id="searchSizeMax" type="number" min="0" step="0.1" placeholder="max" />
          </div>
        </label>
        <label class="search-field">
          <span>在庫数(以下)</span>
          <input id="searchStockMax" type="number" min="0" step="1" placeholder="例: 50" />
        </label>
        <label class="search-field">
          <span>返品率(以下)</span>
          <input id="searchReturnMax" type="number" min="0" step="0.1" placeholder="例: 5" />
        </label>
      </div>
    </div>
    <div class="search-actions">
      <button id="searchDetailBtn" class="ghost-btn" type="button">詳細</button>
      <button id="searchApplyBtn" class="cart-btn" type="button">検索する</button>
      <button id="searchResetBtn" class="ghost-btn" type="button">リセット</button>
    </div>
  </section>

  <section id="cartSummary" class="cart-summary card">
    <div class="cart-head">
      <div class="card-title">今日の合計</div>
      <div class="cart-note">※ 仕入れ額(￥)と販売価格($)×為替(固定)で予測</div>
    </div>
    <div class="cart-grid">
      <div><span>合計数</span><b id="cartItemCount">0個</b></div>
      <div><span>販売額合計</span><b id="cartTotalSales">＄0.00(＄0.00)</b></div>
      <div><span>仕入れ額合計</span><b id="cartTotalCost">￥0(￥0)</b></div>
      <div><span>入金額合計</span><b id="cartTotalPayment">￥0(￥0)</b></div>
      <div><span>粗利益額合計</span><b id="cartTotalProfit">￥0(￥0)</b></div>
      <div><span>粗利益率</span><b id="cartProfitRate">0.0%</b></div>
    </div>
  </section>

  <div id="emptyState" class="empty card">
    検索条件を設定してASINを表示してください
  </div>

  <div id="itemsContainer" class="items-stack"></div>
</main>

<script src="./asin-data.js?v=20250219"></script>
<script src="./main.js?v=20250219"></script>
</body>
</html>
