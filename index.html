<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>MES-AI-A 商品分析（レイアウト5）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./styles.css?v=20260107_2" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body class="fifth-layout">

<header class="app-header">
  <div class="header-left">
    <div class="header-title-row">
      <h1>MES-AI-A 商品分析 0116-13</h1>
      <div id="appVersion" class="header-version" aria-label="アプリのバージョン"></div>
    </div>
    <div class="sub">ASINクリックでカード追加</div>
  </div>

  <div class="header-right">
    <div id="headerStatus" class="header-status"></div>
  </div>
</header>

<main class="page-body">
    <div class="mode-tabs" role="tablist" aria-label="検索モード切替">
      <span class="mode-tabs-label">モード切替</span>
      <div class="mode-tabs-group">
        <label class="mode-tab">
          <input type="radio" name="searchMode" value="seller" checked />
          <span>セラー <span class="mode-shop">SAMURAI SHOP</span></span>
        </label>
        <label class="mode-tab">
          <input type="radio" name="searchMode" value="stock" />
          <span>ストック</span>
        </label>
        <label class="mode-tab">
          <input type="radio" name="searchMode" value="later" />
          <span>後で買う</span>
        </label>
      </div>
    </div>
  <section class="search-panel card" aria-label="検索条件">
    <div class="search-panel-head">
      <div>
        <div class="card-title">検索条件</div>
        <div class="search-note">※ 現在はダミー表示です（検索機能は未実装）</div>
      </div>
    </div>

    <div class="search-grid">
      <div class="search-block search-block-main">
        <div class="search-block-title">メイン検索項目</div>
        <div class="search-fields">
          <label class="field">
            <span>キーワード</span>
            <input type="text" class="search-input search-input-wide" placeholder="例：アウトドア 収納" />
          </label>
          <label class="field">
            <span>粗利益額</span>
            <div class="field-inline">
              <input type="number" class="search-input input-compact" placeholder="円" />
              <span class="unit-chip">円 以上</span>
            </div>
          </label>
          <label class="field">
            <span>粗利益率</span>
            <div class="field-inline">
              <input type="number" class="search-input input-percent" placeholder="%" />
              <span class="unit-chip">% 以上</span>
            </div>
          </label>
          <label class="field">
            <span>ASINスコア</span>
            <div class="field-inline">
              <input type="number" class="search-input input-score" placeholder="スコア" />
              <span class="unit-chip">以上</span>
            </div>
          </label>
          <label class="field">
            <span>返品率</span>
            <div class="field-inline">
              <input type="number" class="search-input input-percent" placeholder="%" />
              <span class="unit-chip">% 以下</span>
            </div>
          </label>
          <label class="field">
            <span>最終仕入れ日</span>
            <input type="date" class="search-input input-date" />
          </label>
          <label class="field">
            <span>推奨仕入数</span>
            <div class="field-inline">
              <select class="search-input input-compact">
                <option>ミニマム</option>
                <option selected>バランス</option>
                <option>ステップアップ</option>
              </select>
              <select class="search-input input-compact">
                <option>30日間</option>
                <option>60日間</option>
                <option>90日間</option>
                <option>120日間</option>
                <option>180日間</option>
              </select>
              <input type="number" class="search-input input-compact" placeholder="個数" />
            </div>
          </label>
        </div>
      </div>
    </div>

    <details class="search-details">
      <summary class="search-details-toggle">詳細検索</summary>
      <div class="search-block search-block-advanced">
        <div class="search-block-title">詳細検索項目</div>
        <div class="search-fields">
          <label class="field">
            <span>除外キーワード</span>
            <input type="text" class="search-input search-input-wide" placeholder="例：中古, 互換品" />
          </label>
          <label class="field">
            <span>評価</span>
            <select class="search-input">
              <option>★★★☆☆</option>
              <option>★★★★☆</option>
              <option>★★★★★</option>
            </select>
          </label>
          <label class="field">
            <span>セラー数</span>
            <div class="field-inline">
              <input type="number" class="search-input input-compact" placeholder="件" />
              <span class="unit-chip">件 以下</span>
            </div>
          </label>
          <label class="field">
            <span>販売数(実績)</span>
            <div class="field-inline">
              <select class="search-input input-compact">
                <option>30日間</option>
              </select>
              <input type="number" class="search-input input-compact" placeholder="個数" />
            </div>
          </label>
          <label class="field">
            <span>販売数(予測)</span>
            <div class="field-inline">
              <select class="search-input input-compact">
                <option>30日間</option>
              </select>
              <input type="number" class="search-input input-compact" placeholder="個数" />
            </div>
          </label>
          <label class="field">
            <span>サイズ感</span>
            <div class="field-inline">
              <input type="number" class="search-input input-compact" placeholder="cm" />
              <span class="unit-chip">cm 以下</span>
            </div>
          </label>
          <label class="field">
            <span>FBA最安値</span>
            <div class="field-inline">
              <input type="number" class="search-input input-compact" placeholder="円" />
              <span class="unit-chip">円 以上</span>
            </div>
          </label>
          <label class="field">
            <span>過去3ヶ月FBA最安値</span>
            <div class="field-inline">
              <input type="number" class="search-input input-compact" placeholder="円" />
              <span class="unit-chip">円 以上</span>
            </div>
          </label>
          <label class="field">
            <span>日本最安値</span>
            <div class="field-inline">
              <input type="number" class="search-input input-compact" placeholder="円" />
              <span class="unit-chip">円 以下</span>
            </div>
          </label>
          <label class="field">
            <span>在庫数</span>
            <div class="field-inline">
              <input type="number" class="search-input input-compact" placeholder="個" />
              <span class="unit-chip">個 以下</span>
            </div>
          </label>
          <div class="field">
            <span>注意事項</span>
            <div class="check-group">
              <label><input type="checkbox" /> 知財</label>
              <label><input type="checkbox" /> 大型</label>
              <label><input type="checkbox" /> 出荷制限</label>
            </div>
          </div>
        </div>
      </div>
    </details>

    <div class="sort-panel sort-panel-accent">
      <div class="sort-panel-title">並び替え</div>
      <div class="sort-panel-controls">
        <div class="sort-chip-list" role="group" aria-label="並び替えの優先順">
          <button type="button" class="sort-chip" data-sort="粗利益額">
            <span class="sort-chip-check" aria-hidden="true">✓</span>
            <span class="sort-chip-label">粗利益額</span>
            <span class="sort-chip-order" aria-hidden="true"></span>
          </button>
          <button type="button" class="sort-chip" data-sort="粗利益率">
            <span class="sort-chip-check" aria-hidden="true">✓</span>
            <span class="sort-chip-label">粗利益率</span>
            <span class="sort-chip-order" aria-hidden="true"></span>
          </button>
          <button type="button" class="sort-chip" data-sort="返品率">
            <span class="sort-chip-check" aria-hidden="true">✓</span>
            <span class="sort-chip-label">返品率</span>
            <span class="sort-chip-order" aria-hidden="true"></span>
          </button>
          <button type="button" class="sort-chip" data-sort="ASINスコア">
            <span class="sort-chip-check" aria-hidden="true">✓</span>
            <span class="sort-chip-label">ASINスコア</span>
            <span class="sort-chip-order" aria-hidden="true"></span>
          </button>
          <button type="button" class="sort-chip" data-sort="FBA最安値">
            <span class="sort-chip-check" aria-hidden="true">✓</span>
            <span class="sort-chip-label">FBA最安値</span>
            <span class="sort-chip-order" aria-hidden="true"></span>
          </button>
          <button type="button" class="sort-chip" data-sort="日本最安値">
            <span class="sort-chip-check" aria-hidden="true">✓</span>
            <span class="sort-chip-label">日本最安値</span>
            <span class="sort-chip-order" aria-hidden="true"></span>
          </button>
          <button type="button" class="sort-chip" data-sort="最終仕入れ日">
            <span class="sort-chip-check" aria-hidden="true">✓</span>
            <span class="sort-chip-label">最終仕入れ日</span>
            <span class="sort-chip-order" aria-hidden="true"></span>
          </button>
        </div>
        <div class="sort-panel-search">
          <button class="search-action search-bulk is-hidden" type="button">一括削除</button>
          <button class="search-action search-reset" type="button">条件リセット</button>
          <button class="search-run" type="button">検索</button>
        </div>
      </div>
    </div>
  </section>

  <section class="asin-catalog card">
    <div class="asin-catalog-head">
      <div class="asin-catalog-title">ASIN一覧</div>
      <button id="asinLoadBtn" class="asin-load-btn" type="button">ASIN一覧を表示</button>
    </div>
    <div class="asin-catalog-body" id="asinCatalog"></div>
  </section>

  <section id="cartSummary" class="cart-summary card">
    <div class="cart-head">
      <div class="card-title">今日の合計</div>
      <div class="cart-note">※ 仕入れ額(￥)と販売価格($)×為替(固定)で予測</div>
    </div>
    <div class="cart-grid">
      <div><span>合計数</span><b id="cartItemCount">0個</b></div>
      <div><span>販売額合計</span><b id="cartTotalSales">＄0.00(＄0.00)</b></div>
      <div><span>仕入れ額合計</span><b id="cartTotalCost">￥0(￥0)</b></div>
      <div><span>入金額合計</span><b id="cartTotalPayment">￥0(￥0)</b></div>
      <div><span>粗利益額合計</span><b id="cartTotalProfit">￥0(￥0)</b></div>
      <div><span>粗利益率</span><b id="cartProfitRate">0.0%</b></div>
    </div>
  </section>

  <div id="emptyState" class="empty card">
    検索後にASINをクリックして商品を表示してください
  </div>

  <div id="itemsContainer" class="items-stack"></div>
</main>

<script src="./asin-data.js?v=20250219"></script>
<script src="./main.js?v=20250219"></script>
</body>
</html>
