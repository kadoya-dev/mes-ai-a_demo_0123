<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>MES-AI-A 商品分析（レイアウト5）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./styles.css?v=20260107_2" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body class="fifth-layout">

<header class="app-header">
  <div class="header-left">
    <div class="header-title-row">
      <h1>MES-AI-A 商品分析 0116-13</h1>
      <div id="appVersion" class="header-version" aria-label="アプリのバージョン"></div>
    </div>
    <div class="sub">ASINクリックでカード追加</div>
  </div>

  <div class="header-right">
    <div id="headerStatus" class="header-status"></div>
  </div>
</header>

<main class="page-body">
  <section class="search-panel card" aria-label="検索条件">
    <div class="search-panel-head">
      <div>
        <div class="card-title">検索条件</div>
        <div class="search-note">※ 現在はダミー表示です（検索機能は未実装）</div>
      </div>
      <div class="search-mode">
        <span class="search-mode-label">モード切替</span>
        <div class="mode-toggle">
          <label><input type="radio" name="searchMode" checked /> セラー</label>
          <label><input type="radio" name="searchMode" /> ストック</label>
          <label><input type="radio" name="searchMode" /> 後で買う</label>
        </div>
      </div>
    </div>

    <div class="search-grid">
      <div class="search-block search-block-main">
        <div class="search-block-title">メイン検索項目</div>
        <div class="search-fields">
          <label class="field">
            <span>キーワード</span>
            <input type="text" class="search-input" placeholder="例：アウトドア 収納" />
          </label>
          <label class="field">
            <span>返品率</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="%" />
              <span class="unit-chip">% 以下</span>
            </div>
          </label>
          <label class="field">
            <span>粗利益額</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="円" />
              <span class="unit-chip">円 以上</span>
            </div>
          </label>
          <label class="field">
            <span>粗利益率</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="%" />
              <span class="unit-chip">% 以上</span>
            </div>
          </label>
          <label class="field">
            <span>ASINスコア</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="スコア" />
              <span class="unit-chip">以上</span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <details class="search-details">
      <summary class="search-details-toggle">詳細検索</summary>
      <div class="search-block search-block-advanced">
        <div class="search-block-title">詳細検索項目</div>
        <div class="search-fields">
          <label class="field">
            <span>除外キーワード</span>
            <input type="text" class="search-input" placeholder="例：中古, 互換品" />
          </label>
          <label class="field">
            <span>評価 ★★★☆☆ 以上</span>
            <select class="search-input">
              <option>★★★☆☆</option>
              <option>★★★★☆</option>
              <option>★★★★★</option>
            </select>
          </label>
          <div class="field">
            <span>注意事項</span>
            <div class="check-group">
              <label><input type="checkbox" /> 知財</label>
              <label><input type="checkbox" /> 大型</label>
              <label><input type="checkbox" /> 出荷制限</label>
            </div>
          </div>
          <div class="field">
            <span>カテゴリー</span>
            <div class="check-group">
              <label><input type="checkbox" /> 家電</label>
              <label><input type="checkbox" /> ホーム</label>
              <label><input type="checkbox" /> ビューティー</label>
            </div>
          </div>
          <div class="field">
            <span>材質</span>
            <div class="check-group">
              <label><input type="checkbox" /> プラスチック</label>
              <label><input type="checkbox" /> 金属</label>
              <label><input type="checkbox" /> 木材</label>
            </div>
          </div>
          <label class="field">
            <span>セラー数</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="件" />
              <span class="unit-chip">件 以下</span>
            </div>
          </label>
          <label class="field">
            <span>サイズ感</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="cm" />
              <span class="unit-chip">cm 以下</span>
            </div>
          </label>
          <label class="field">
            <span>FBA最安値</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="円" />
              <span class="unit-chip">円 以上</span>
            </div>
          </label>
          <label class="field">
            <span>過去3ヶ月FBA最安値</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="円" />
              <span class="unit-chip">円 以上</span>
            </div>
          </label>
          <label class="field">
            <span>日本最安値</span>
            <div class="field-inline">
              <input type="number" class="search-input" placeholder="円" />
              <span class="unit-chip">円 以下</span>
            </div>
          </label>
        </div>
      </div>
    </details>

    <div class="sort-panel sort-panel-accent">
      <div class="sort-panel-title">ソート順</div>
      <div class="sort-panel-controls">
        <select class="search-input">
          <option>粗利益額</option>
          <option>粗利益率</option>
          <option>返品率</option>
          <option>ASINスコア</option>
          <option>FBA最安値</option>
          <option>日本最安値</option>
        </select>
        <select class="search-input">
          <option>降順</option>
          <option>昇順</option>
        </select>
        <button class="search-action" type="button">ソートを反映</button>
      </div>
    </div>
  </section>

  <section class="asin-catalog card">
    <div class="asin-catalog-head">
      <div class="asin-catalog-title">ASIN一覧</div>
      <button id="asinLoadBtn" class="asin-load-btn" type="button">ASIN一覧を表示</button>
    </div>
    <div class="asin-catalog-body" id="asinCatalog"></div>
  </section>

  <section id="cartSummary" class="cart-summary card">
    <div class="cart-head">
      <div class="card-title">今日の合計</div>
      <div class="cart-note">※ 仕入れ額(￥)と販売価格($)×為替(固定)で予測</div>
    </div>
    <div class="cart-grid">
      <div><span>合計数</span><b id="cartItemCount">0個</b></div>
      <div><span>販売額合計</span><b id="cartTotalSales">＄0.00(＄0.00)</b></div>
      <div><span>仕入れ額合計</span><b id="cartTotalCost">￥0(￥0)</b></div>
      <div><span>入金額合計</span><b id="cartTotalPayment">￥0(￥0)</b></div>
      <div><span>粗利益額合計</span><b id="cartTotalProfit">￥0(￥0)</b></div>
      <div><span>粗利益率</span><b id="cartProfitRate">0.0%</b></div>
    </div>
  </section>

  <div id="emptyState" class="empty card">
    検索後にASINをクリックして商品を表示してください
  </div>

  <div id="itemsContainer" class="items-stack"></div>
</main>

<script src="./asin-data.js?v=20250219"></script>
<script src="./main.js?v=20250219"></script>
</body>
</html>
